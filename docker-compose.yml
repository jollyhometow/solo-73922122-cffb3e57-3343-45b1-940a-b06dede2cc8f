services:
  reducer:
    build: .
    image: sqlite-repro-reducer:1.0.0
    container_name: sqlite-repro-reducer
    ports:
      - "8000:8000"
    volumes:
      - reducer-data:/data
    environment:
      # 可用环境变量覆盖默认值（见 app/config.py）
      MAX_TRIALS: "800"
      TRIAL_TIMEOUT_SECONDS: "15"
      JOB_TTL_SECONDS: "3600"
      MAX_CONCURRENT_JOBS: "2"
    restart: unless-stopped

volumes:
  reducer-data:
